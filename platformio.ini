; PlatformIO configuration for the current aim-receiver firmware.

[platformio]
default_envs = hexapod

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

[env:hexapod]
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    pololu/VL53L0X
build_src_filter =
    +<main_hexapod.cpp>
    +<HexapodState.cpp>
    +<CannonPreparation.cpp>
    +<GaitController.cpp>
    +<GaitProfiles.cpp>
    +<Kinematics.cpp>
    +<NavigationController.cpp>
    +<ObstacleNavigation.cpp>
    +<AimMessageHandler.cpp>
    +<CannonController.cpp>
    +<LegController.cpp>
    +<ToFSensors.cpp>
    +<ToFManager.cpp>
    +<WebCannon.cpp>
    +<WebContent.cpp>
    +<WebFirmwareUpdate.cpp>
    +<WebInterface.cpp>
    +<WebMovement.cpp>
    +<WebStatus.cpp>
